[project]
name = "smartcampus-agent-service"
version = "0.1.0"
description = "SmartCampus : service d'agent IA (Claude + Pydantic AI), authentifie par les JWT du user-service"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim[google,anthropic]>=1.0",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "pyjwt[crypto]>=2.9",
  "pymongo>=4.9",
  "fpdf2>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
voice = ["piper-tts>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
[tool.ruff.lint.per-file-ignores]
"evals/*" = ["E501", "S105"]
"tests/*" = ["S101", "S105", "S106", "E501"]
