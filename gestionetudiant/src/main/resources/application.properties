```
spring.application.name=gestionetudiant

# PostgreSQL Database Configuration (avec variables d'environnement par défaut)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionetudiant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ahlem}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Les DTO sont mappés dans les services transactionnels : pas besoin de la session ouverte sur la vue.
spring.jpa.open-in-view=false

# Documentation API (OpenAPI / Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html

# Server — port du backend attendu par le front (VITE_API_BASE_URL=http://localhost:8081/api)
server.port=8081

# Supports pedagogiques : upload multipart (PDF, PPTX, DOCX, ZIP, video...)
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=65MB

# Repertoire disque des fichiers uploades, servis sous /uploads/** (WebConfig)
app.uploads.dir=${user.dir}/uploads

# --- Sécurité (JWT du user-service validé localement, cf. SecurityConfig) ---
# Valeur par défaut ouverte : passez à false pour exiger le jeton sur toutes les routes.
app.security.enforce-auth=${SECURITY_ENFORCE_AUTH:true}
app.jwt.secret=change-me-en-production-32-caracteres-minimum
app.jwt.issuer=smartcampus-user-service
app.jwt.audience=smartcampus
app.cors.origin=http://localhost:5173
///


