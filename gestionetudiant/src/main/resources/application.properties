spring.application.name=gestionetudiant

# Base de donnees : H2 en memoire par defaut (sans installation) ou PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:gestionetudiant_db;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka optionnel (desactive par defaut pour eviter les erreurs de log)
eureka.client.enabled=${EUREKA_ENABLED:false}

# Documentation API (OpenAPI / Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html

# Server — port 8081
server.port=8081

# Supports pedagogiques : upload multipart
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=65MB

# Repertoire disque des fichiers uploades, servis sous /uploads/** (WebConfig)
app.uploads.dir=${user.dir}/uploads

# --- Securite (JWT du user-service valide avec le meme secret) ---
app.security.enforce-auth=${SECURITY_ENFORCE_AUTH:true}
app.jwt.secret=${JWT_SECRET:change-me-en-production-32-caracteres-minimum}
app.jwt.issuer=smartcampus-user-service
app.jwt.audience=smartcampus
app.cors.origin=http://localhost:5173
# Origines du front autorisees (CORS + controle CSRF des ecritures par cookie), separees par des virgules
app.jwt.cors-origins=${CORS_ORIGINS:http://localhost:5173}
