server:
  port: ${PORT:8080}

app:
  jwt:
    # Doit etre identique a JWT_SECRET du user-service. Obligatoire en production (profil prod : demarrage refuse sinon).
    secret: ${JWT_SECRET:change-me-en-production-32-caracteres-minimum}
    issuer: ${JWT_ISSUER:smartcampus-user-service}
    audience: ${JWT_AUDIENCE:smartcampus}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173}

spring:
  application:
    name: smartcampus-gestion-ressources
  profiles:
    active: dev
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:bdd_ressources;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://10.20.5.20:5432/BDD_Ressources
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
