spring.application.name=vie-etudiante
server.port=4005

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartcampus_student_life}

# CORS pour le front Vite
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}

# Sécurité & Validation JWT
# Passer enforce-auth à true pour exiger le JWT du user-service sur toutes les routes protégées
app.security.enforce-auth=${SECURITY_ENFORCE_AUTH:false}
app.jwt.jwks-uri=${JWKS_URI:http://localhost:4001/.well-known/jwks.json}
app.jwt.secret=${JWT_SECRET:change-me-en-production-32-caracteres-minimum}
app.jwt.issuer=${JWT_ISSUER:smartcampus-user-service}
app.jwt.audience=${JWT_AUDIENCE:smartcampus}
